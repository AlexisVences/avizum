services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: avizum
      POSTGRES_PASSWORD: change-me
      POSTGRES_DB: avizum
    ports:
      - "5432:5432"
    volumes:
      - avizum-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U avizum -d avizum"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  avizum-db:
